<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>我的記錄</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #1A3A5C;
    --navy-light: #2D5F8A;
    --red: #C0392B;
    --orange: #D35400;
    --green: #27AE60;
    --red-bg: #FDF0EE;
    --orange-bg: #FEF5EC;
    --green-bg: #EBF9F1;
    --gray: #F4F6F9;
    --border: #E5EBF2;
    --text: #1a1a2e;
    --muted: #6B7280;
    --radius: 14px;
    --shadow: 0 2px 16px rgba(26,58,92,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: #F0F4F8;
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: var(--navy);
    padding: 20px 20px 28px;
    position: relative; overflow: hidden;
  }
  .header::after {
    content: ''; position: absolute;
    bottom: -20px; left: 0; right: 0; height: 40px;
    background: #F0F4F8;
    border-radius: 50% 50% 0 0 / 20px 20px 0 0;
  }
  .header-label { color: #7EB8E8; font-size: 12px; letter-spacing: 2px; }
  .header-title { color: #fff; font-size: 22px; font-weight: 700; margin-top: 4px; }
  .header-sub   { color: #AACCEE; font-size: 13px; margin-top: 4px; }

  .main { padding: 12px 16px 40px; }

  /* Stats row */
  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 20px;
  }
  .stat-card {
    background: #fff; border-radius: 12px;
    padding: 14px 10px; text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-num { font-size: 28px; font-weight: 800; }
  .stat-num.red    { color: var(--red); }
  .stat-num.orange { color: var(--orange); }
  .stat-num.green  { color: var(--green); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Section title */
  .section-title {
    font-size: 13px; font-weight: 700; color: var(--navy);
    margin: 20px 0 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title span { font-size: 11px; color: var(--muted); font-weight: 400; }

  /* Log items */
  .log-list { display: flex; flex-direction: column; gap: 8px; }
  .log-item {
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
    display: flex; align-items: stretch;
  }
  .log-level-bar {
    width: 5px; flex-shrink: 0;
  }
  .log-level-bar.l1 { background: var(--red); }
  .log-level-bar.l2 { background: var(--orange); }
  .log-level-bar.l3 { background: var(--green); }
  .log-content { padding: 12px 14px; flex: 1; }
  .log-top {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .log-symptom { font-size: 15px; font-weight: 700; color: var(--text); }
  .log-badge {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    flex-shrink: 0; margin-left: 8px;
  }
  .log-badge.l1 { background: var(--red-bg); color: var(--red); }
  .log-badge.l2 { background: var(--orange-bg); color: var(--orange); }
  .log-badge.l3 { background: var(--green-bg); color: var(--green); }
  .log-followup { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .log-time { font-size: 11px; color: #B0B8C4; margin-top: 6px; }

  .empty-state {
    text-align: center; padding: 50px 20px;
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { color: var(--muted); font-size: 14px; line-height: 1.6; }

  /* Profile Card */
  .profile-card {
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .profile-header {
    background: var(--gray);
    padding: 12px 18px;
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .edit-link {
    font-size: 12px; color: var(--navy); font-weight: 600;
    text-decoration: none; cursor: pointer; border: none; background: none;
  }
  .profile-row {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center;
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-icon { font-size: 18px; width: 24px; text-align: center; }
  .profile-key { font-size: 11px; color: var(--muted); }
  .profile-val { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
  .profile-val.empty { color: #B0B8C4; font-weight: 400; font-style: italic; }

  /* Edit form */
  .edit-form { padding: 16px 18px; display: none; border-top: 1px solid var(--border); }
  .edit-form.open { display: block; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .form-input {
    width: 100%; border: 2px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 15px; color: var(--text);
    background: var(--gray); transition: border-color 0.2s; -webkit-appearance: none;
  }
  .form-input:focus { outline: none; border-color: var(--navy); background: #fff; }
  .form-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn-save {
    flex: 2; background: var(--navy); color: #fff;
    border: none; border-radius: 10px;
    padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn-cancel-small {
    flex: 1; background: var(--gray); color: var(--muted);
    border: 2px solid var(--border); border-radius: 10px;
    padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #2ECC71; color: #fff;
    padding: 12px 24px; border-radius: 30px;
    font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* Tab 切換 */
  .tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:16px; }
  .tab-btn { flex:1; padding:12px 8px; font-size:14px; font-weight:600;
    color:var(--muted); background:none; border:none; cursor:pointer;
    border-bottom:3px solid transparent; margin-bottom:-2px; transition:.2s; }
  .tab-btn.active { color:var(--navy); border-bottom-color:var(--navy); }

  /* 趨勢圖 */
  .chart-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:16px; }
  .chart-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chart-tab { padding:5px 12px; border-radius:20px; font-size:12px; font-weight:600;
    border:2px solid var(--border); background:var(--gray); color:var(--muted); cursor:pointer; }
  .chart-tab.active { background:var(--navy); color:#fff; border-color:var(--navy); }

  /* 生命徵象列表 */
  .vlist { display:flex; flex-direction:column; gap:8px; }
  .vitem { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 16px; }
  .vitem-time { font-size:11px; color:var(--muted); margin-bottom:8px; }
  .vgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .vcell { text-align:center; background:var(--gray); border-radius:8px; padding:8px 4px; }
  .vcell-val { font-size:16px; font-weight:700; color:var(--navy); }
  .vcell-val.alert-l1 { color:var(--red); }
  .vcell-val.alert-l2 { color:var(--orange); }
  .vcell-lbl { font-size:10px; color:var(--muted); margin-top:2px; }
  .vcell.empty-cell { opacity:.35; }

  .loading {
    text-align: center; padding: 80px 20px; color: var(--muted);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-label">My Records</div>
  <div class="header-title">📋 我的記錄</div>
  <div class="header-sub" id="header-sub">載入中…</div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab-btn active" id="tab-sym" onclick="switchTab('sym')">💊 症狀記錄</button>
    <button class="tab-btn" id="tab-vit" onclick="switchTab('vit')">💓 生命徵象</button>
  </div>
  <div id="main-content">
  <div class="loading">
    <div class="spinner"></div>
    <div>載入中…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let userId = '';
let GAS_URL = 'https://script.google.com/macros/s/AKfycbx2nSmOjcKrcMpK9XwRHWz-JeUFfHCoNggMnIYHyKx7B_338N8XQk3stmXIQ1Ppj1Z25w/exec'; // ← 部署後填入
let profileData = {};

const LEVEL_INFO = {
  '1': { cls:'l1', badge:'🚨 第一級' },
  '2': { cls:'l2', badge:'⚠️ 第二級' },
  '3': { cls:'l3', badge:'✅ 第三級' },
};

async function init() {
  await liff.init({ liffId: '2010034796-FdmhTXPK' }); // ← 填入
  if (!liff.isLoggedIn()) { liff.login(); return; }
  const profile = await liff.getProfile();
  userId = profile.userId;
  await loadAll();
}

async function loadAll() {
  try {
    const [patientRes, logsRes] = await Promise.all([
      fetch(`${GAS_URL}?action=getPatient&userId=${userId}`).then(r=>r.json()),
      fetch(`${GAS_URL}?action=getLogs&userId=${userId}`).then(r=>r.json()),
    ]);

    profileData = patientRes.data || {};
    const logs  = logsRes.data  || [];

    document.getElementById('header-sub').textContent =
      profileData.real_name ? `${profileData.real_name} 的記錄` : '症狀回報記錄';

    renderPage(logs, profileData);
    // 初始化 vitals section
    if (!document.getElementById('section-vit')) {
      const mainEl = document.getElementById('main-content');
      mainEl.insertAdjacentHTML('beforeend', '<div id="section-vit" style="display:none"></div>');
    }
  } catch(e) {
    document.getElementById('main-content').innerHTML =
      '<div class="loading"><div>載入失敗，請重試</div></div>';
  }
}

function renderPage(logs, patient) {
  const l1 = logs.filter(l => String(l.level) === '1').length;
  const l2 = logs.filter(l => String(l.level) === '2').length;
  const l3 = logs.filter(l => String(l.level) === '3').length;

  let logsHtml = '';
  if (logs.length === 0) {
    logsHtml = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-text">還沒有症狀記錄<br>有不適時請點選「回報症狀」</div>
      </div>`;
  } else {
    logsHtml = '<div class="log-list">';
    logs.forEach(log => {
      const lv   = String(log.level);
      const info = LEVEL_INFO[lv] || { cls:'l3', badge:'—' };
      const fu   = log.followup_answer ? `<div class="log-followup">↳ ${log.followup_answer}</div>` : '';
      const time = String(log.timestamp).slice(0, 16);
      logsHtml += `
        <div class="log-item">
          <div class="log-level-bar ${info.cls}"></div>
          <div class="log-content">
            <div class="log-top">
              <div class="log-symptom">${log.symptom_label || log.symptom_id}</div>
              <div class="log-badge ${info.cls}">${info.badge}</div>
            </div>
            ${fu}
            <div class="log-time">🕐 ${time}</div>
          </div>
        </div>`;
    });
    logsHtml += '</div>';
  }

  const realName = patient.real_name || '';
  const mrn      = patient.mrn || '';

  // 確保 section-sym 存在
  if (!document.getElementById('section-sym')) {
    document.getElementById('main-content').innerHTML = '<div id="section-sym"></div><div id="section-vit" style="display:none"></div>';
  }
  document.getElementById('section-sym').innerHTML = `
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num red">${l1}</div>
        <div class="stat-label">🚨 第一級</div>
      </div>
      <div class="stat-card">
        <div class="stat-num orange">${l2}</div>
        <div class="stat-label">⚠️ 第二級</div>
      </div>
      <div class="stat-card">
        <div class="stat-num green">${l3}</div>
        <div class="stat-label">✅ 第三級</div>
      </div>
    </div>

    <!-- 個人資料 -->
    <div class="section-title">👤 我的資料</div>
    <div class="profile-card">
      <div class="profile-header">
        個人資料
        <button class="edit-link" onclick="toggleEdit()">✏️ 編輯</button>
      </div>
      <div class="profile-row">
        <div class="profile-icon">👤</div>
        <div>
          <div class="profile-key">姓名</div>
          <div class="profile-val ${!realName ? 'empty' : ''}">${realName || '尚未填寫'}</div>
        </div>
      </div>
      <div class="profile-row">
        <div class="profile-icon">🏥</div>
        <div>
          <div class="profile-key">病歷號</div>
          <div class="profile-val ${!mrn ? 'empty' : ''}">${mrn || '尚未填寫'}</div>
        </div>
      </div>

      <!-- 編輯表單 -->
      <div class="edit-form" id="edit-form">
        <div class="form-group">
          <div class="form-label">👤 姓名</div>
          <input class="form-input" id="input-name" type="text"
                 placeholder="請填入您的姓名" value="${realName}" maxlength="20">
        </div>
        <div class="form-group">
          <div class="form-label">🏥 病歷號</div>
          <input class="form-input" id="input-mrn" type="text"
                 placeholder="請填入您的病歷號" value="${mrn}" maxlength="20">
        </div>
        <div class="form-actions">
          <button class="btn-save" onclick="saveProfile()">💾 儲存</button>
          <button class="btn-cancel-small" onclick="toggleEdit()">取消</button>
        </div>
      </div>
    </div>

    <!-- 症狀記錄 -->
    <div class="section-title">
      📊 症狀記錄
      <span>最近 ${logs.length} 筆</span>
    </div>
    ${logsHtml}
  `;
}

function toggleEdit() {
  const form = document.getElementById('edit-form');
  form.classList.toggle('open');
  if (form.classList.contains('open')) {
    document.getElementById('input-name').focus();
  }
}

async function saveProfile() {
  const realName = document.getElementById('input-name').value.trim();
  const mrn      = document.getElementById('input-mrn').value.trim();

  const btn = document.querySelector('.btn-save');
  btn.textContent = '儲存中…';
  btn.disabled = true;

  try {
    const r = await fetch(
      `${GAS_URL}?action=savePatient&userId=${userId}` +
      `&realName=${encodeURIComponent(realName)}` +
      `&mrn=${encodeURIComponent(mrn)}`
    );
    const d = await r.json();

    if (d.ok) {
      profileData.real_name = realName;
      profileData.mrn = mrn;
      showToast('✅ 資料已更新！');
      setTimeout(() => loadAll(), 1000);
    } else {
      alert('儲存失敗，請重試');
    }
  } catch(e) {
    alert('網路錯誤，請重試');
  } finally {
    btn.textContent = '💾 儲存';
    btn.disabled = false;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}


// ════ 生命徵象 ════
let vitalsData = [];
let vChart = null;
let activeChartKey = 'sbp';

const CHART_ITEMS = [
  { key:'sbp',    label:'收縮壓', unit:'mmHg', color:'#C0392B', l1_hi:180,l1_lo:80, l2_hi:160,l2_lo:90 },
  { key:'dbp',    label:'舒張壓', unit:'mmHg', color:'#E74C3C', l1_hi:null,l1_lo:null,l2_hi:null,l2_lo:null },
  { key:'hr',     label:'心跳',   unit:'bpm',  color:'#E91E8C', l1_hi:130,l1_lo:40,l2_hi:110,l2_lo:50 },
  { key:'temp',   label:'體溫',   unit:'°C',   color:'#D35400', l1_hi:38.0,l1_lo:null,l2_hi:37.5,l2_lo:null },
  { key:'weight', label:'體重',   unit:'kg',   color:'#2D5F8A', l1_hi:null,l1_lo:null,l2_hi:null,l2_lo:null },
  { key:'glucose',label:'血糖',   unit:'mg/dL',color:'#8E44AD', l1_hi:400,l1_lo:50,l2_hi:300,l2_lo:70 },
];

function switchTab(tab) {
  document.getElementById('tab-sym').classList.toggle('active', tab==='sym');
  document.getElementById('tab-vit').classList.toggle('active', tab==='vit');
  document.getElementById('section-sym').style.display = tab==='sym'?'block':'none';
  document.getElementById('section-vit').style.display = tab==='vit'?'block':'none';
  if (tab==='vit' && vitalsData.length===0) loadVitals();
}

async function loadVitals() {
  const el = document.getElementById('section-vit');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><div>載入中…</div></div>';
  try {
    const r = await fetch(`${GAS_URL}?action=getVitals&userId=${userId}`);
    const d = await r.json();
    vitalsData = d.data || [];
    renderVitals();
  } catch(e) {
    el.innerHTML = '<div class="loading"><div>載入失敗，請重試</div></div>';
  }
}

function getAlertClass(key, val) {
  if (!val || val === '') return '';
  const item = CHART_ITEMS.find(i => i.key === key);
  if (!item || !item.l1_hi) return '';
  const n = parseFloat(val);
  if (isNaN(n)) return '';
  if ((item.l1_hi && n >= item.l1_hi)||(item.l1_lo && n <= item.l1_lo)) return 'alert-l1';
  if ((item.l2_hi && n >= item.l2_hi)||(item.l2_lo && n <= item.l2_lo)) return 'alert-l2';
  return '';
}

function renderVitals() {
  const el = document.getElementById('section-vit');
  if (!vitalsData.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">尚無生命徵象記錄<br>請點選「💓 生命徵象」按鈕輸入數值</div>';
    return;
  }

  const chartTabsHtml = CHART_ITEMS.map(i =>
    `<button class="chart-tab${i.key===activeChartKey?' active':''}" onclick="switchChart('${i.key}')">${i.label}</button>`
  ).join('');

  const listHtml = vitalsData.map(v => {
    const cells = [
      {key:'sbp',val:v.sbp,label:'收縮壓'},{key:'dbp',val:v.dbp,label:'舒張壓'},
      {key:'hr',val:v.hr,label:'心跳'},{key:'temp',val:v.temp,label:'體溫'},
      {key:'weight',val:v.weight,label:'體重'},{key:'glucose',val:v.glucose,label:'血糖'},
    ];
    const cellsHtml = cells.map(c => {
      if (!c.val||c.val==='') return `<div class="vcell empty-cell"><div class="vcell-val">—</div><div class="vcell-lbl">${c.label}</div></div>`;
      const ac = getAlertClass(c.key, c.val);
      return `<div class="vcell${ac?' '+ac:''}"><div class="vcell-val">${c.val}</div><div class="vcell-lbl">${c.label}</div></div>`;
    }).join('');
    const ts = String(v.recorded_at||v.saved_at||'').slice(0,16);
    return `<div class="vitem">
      <div class="vitem-time">🕐 ${ts}</div>
      <div class="vgrid">${cellsHtml}</div>
      ${v.note?`<div style="font-size:12px;color:var(--muted);margin-top:8px">📝 ${v.note}</div>`:''}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="chart-card">
      <div class="chart-tabs">${chartTabsHtml}</div>
      <canvas id="vitals-chart" height="200"></canvas>
    </div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);margin:16px 0 8px">
      📊 最近 ${vitalsData.length} 筆（依時間倒序）
    </div>
    <div class="vlist">${listHtml}</div>`;

  drawChart(activeChartKey);
}

function switchChart(key) {
  activeChartKey = key;
  document.querySelectorAll('.chart-tab').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick') === `switchChart('${key}')`);
  });
  drawChart(key);
}

function drawChart(key) {
  const item = CHART_ITEMS.find(i => i.key === key);
  if (!item) return;
  const canvas = document.getElementById('vitals-chart');
  if (!canvas) return;
  const pts = vitalsData
    .filter(v => v[key] && v[key]!=='')
    .sort((a,b) => String(a.recorded_at||a.saved_at).localeCompare(String(b.recorded_at||b.saved_at)));
  if (vChart) { vChart.destroy(); vChart = null; }
  const labels = pts.map(v => String(v.recorded_at||v.saved_at||'').slice(5,16));
  const values = pts.map(v => parseFloat(v[key]));
  vChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: `${item.label} (${item.unit})`,
        data: values,
        borderColor: item.color,
        backgroundColor: item.color + '20',
        pointBackgroundColor: values.map(v => {
          if (item.l1_hi&&(v>=item.l1_hi||(item.l1_lo&&v<=item.l1_lo))) return '#C0392B';
          if (item.l2_hi&&(v>=item.l2_hi||(item.l2_lo&&v<=item.l2_lo))) return '#D35400';
          return item.color;
        }),
        pointRadius: 5, tension: 0.3, fill: true,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend:{display:false}, tooltip:{callbacks:{label:ctx=>`${item.label}: ${ctx.raw} ${item.unit}`}} },
      scales: { y:{ title:{display:true,text:item.unit} } }
    }
  });
}

init().catch(console.error);
</script>
</body>
</html>
