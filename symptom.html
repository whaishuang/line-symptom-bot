<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>症狀回報</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --navy:   #1A3A5C;
  --grn:    #27AE60;
  --ora:    #E67E22;
  --yel:    #F39C12;
  --red:    #C0392B;
  --gray:   #F4F6F9;
  --bdr:    #E2E8F0;
  --txt:    #1E293B;
  --muted:  #64748B;
  --shadow: 0 2px 12px rgba(26,58,92,.08);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: var(--gray); color: var(--txt); min-height: 100vh;
}

/* Header */
.header {
  background: var(--navy); padding: 18px 20px 30px;
  position: relative; overflow: hidden;
}
.header::after {
  content: ''; position: absolute; bottom: -20px; left: 0; right: 0;
  height: 40px; background: var(--gray);
  border-radius: 50% 50% 0 0 / 20px 20px 0 0;
}
.h-title { color: #fff; font-size: 20px; font-weight: 800; }
.h-sub   { color: #AACCEE; font-size: 12px; margin-top: 4px; }

/* Screens */
.screen { display: none; }
.screen.active { display: block; }

/* ── 症狀清單 ── */
.main { padding: 12px 16px 40px; }
.no-sym-wrap { margin-bottom: 10px; }
.no-sym-btn {
  width: 100%; padding: 18px; border: 2px solid var(--grn);
  border-radius: var(--radius); background: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 16px; font-weight: 700; color: var(--grn);
  box-shadow: var(--shadow); transition: .15s;
}
.no-sym-btn:active { background: #EBF9F1; transform: scale(.98); }
.divider-label {
  font-size: 12px; color: var(--muted); font-weight: 600;
  margin: 10px 0 8px; letter-spacing: .5px;
}
.cat-label {
  font-size: 12px; font-weight: 700; color: var(--navy);
  background: rgba(26,58,92,.08); border-radius: 8px;
  padding: 4px 10px; margin: 12px 0 6px; display: inline-block;
}
.sym-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 4px; }
.sym-btn {
  background: #fff; border: 1.5px solid var(--bdr); border-radius: var(--radius);
  padding: 14px 8px; text-align: center; cursor: pointer;
  box-shadow: var(--shadow); transition: .15s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.sym-btn:active { transform: scale(.96); background: var(--gray); }
.sym-icon { font-size: 24px; line-height: 1; }
.sym-name { font-size: 12px; font-weight: 600; color: var(--txt); line-height: 1.3; }

/* ── 追問頁 ── */
.fu-header {
  background: var(--navy); padding: 16px 20px;
  color: #fff; font-size: 14px; font-weight: 700;
}
.fu-body { padding: 20px 16px; }
.fu-q { font-size: 15px; font-weight: 600; margin-bottom: 16px; line-height: 1.6; }
.fu-note { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.opt-btn {
  display: block; width: 100%; padding: 14px 16px;
  background: #fff; border: 1.5px solid var(--bdr); border-radius: var(--radius);
  text-align: left; font-size: 14px; font-weight: 500; cursor: pointer;
  margin-bottom: 8px; box-shadow: var(--shadow); transition: .15s; color: var(--txt);
}
.opt-btn:active { background: var(--gray); border-color: var(--navy); }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; color: var(--muted);
  font-size: 13px; cursor: pointer; padding: 12px 16px;
}

/* ── 結果頁 ── */
.result-header {
  padding: 24px 20px; text-align: center;
  position: relative; overflow: hidden;
}
.result-header.l1  { background: linear-gradient(135deg, #C0392B, #E74C3C); }
.result-header.l2a { background: linear-gradient(135deg, #D35400, #E67E22); }
.result-header.l2b { background: linear-gradient(135deg, #B8860B, #F39C12); }
.result-header.l3  { background: linear-gradient(135deg, #1A6B40, #27AE60); }
.result-icon  { font-size: 48px; margin-bottom: 8px; }
.result-badge {
  display: inline-block; padding: 4px 14px; border-radius: 20px;
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  background: rgba(255,255,255,.25); color: #fff; margin-bottom: 8px;
}
.result-title { font-size: 22px; font-weight: 800; color: #fff; }
.result-body  { padding: 20px 16px 100px; }
.result-msg   {
  background: #fff; border-radius: var(--radius);
  padding: 16px; font-size: 14px; line-height: 1.9;
  box-shadow: var(--shadow); margin-bottom: 14px;
}
.result-msg strong { color: var(--navy); }

/* 個管師卡片 */
.cm-card {
  background: #fff; border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 14px;
  border-left: 4px solid var(--navy);
}
.cm-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.cm-name  { font-size: 16px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
.cm-info  { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.cm-btns  { display: flex; gap: 8px; }
.cm-btn   {
  flex: 1; padding: 10px; border-radius: 10px; border: none;
  font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.cm-btn-call  { background: var(--navy); color: #fff; }
.cm-btn-sms   { background: #E8F0F8; color: var(--navy); }
.cm-btn-email { background: #E8F0F8; color: var(--navy); }

/* streak */
.streak-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #F39C12, #E67E22);
  color: #fff; border-radius: 20px; padding: 6px 14px;
  font-size: 13px; font-weight: 700; margin-bottom: 10px;
}
.streak-milestone {
  background: #FEF9E7; border: 2px solid #F39C12;
  border-radius: var(--radius); padding: 10px 14px;
  font-size: 13px; color: #7D6608; text-align: center; font-weight: 600;
  margin-bottom: 14px;
}

/* 底部按鈕 */
.result-footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 16px; background: #fff;
  border-top: 1px solid var(--bdr); box-shadow: 0 -4px 16px rgba(0,0,0,.06);
}
.result-footer { display: flex; flex-direction: column; gap: 8px; }
.btn-done {
  display: block; width: 100%; padding: 14px;
  background: var(--grn); color: #fff; border: none;
  border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer;
}
.btn-again {
  display: block; width: 100%; padding: 12px;
  background: #fff; color: var(--navy);
  border: 2px solid var(--navy);
  border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer;
}

/* 載入 */
.loading { text-align: center; padding: 80px 20px; color: var(--muted); }
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--bdr);
  border-top-color: var(--navy); border-radius: 50%;
  animation: spin .8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="screen-loading" class="screen active">
  <div class="loading"><div class="spinner"></div><div>載入中…</div></div>
</div>

<!-- 症狀清單 -->
<div id="screen-list" class="screen">
  <div class="header">
    <div class="h-title">🩺 症狀回報</div>
    <div class="h-sub">請選擇今天最不舒服的症狀</div>
  </div>
  <div class="main">
    <div class="no-sym-wrap">
      <button class="no-sym-btn" onclick="selectSym('no_symptom')">
        <span style="font-size:26px">😊</span> 無症狀
      </button>
    </div>
    <div class="divider-label">或選擇不適症狀：</div>
    <div id="symptom-list"></div>
  </div>
</div>

<!-- 追問頁 -->
<div id="screen-followup" class="screen">
  <button class="back-btn" onclick="showScreen('list')">‹ 返回</button>
  <div class="fu-header" id="fu-header"></div>
  <div class="fu-body">
    <div class="fu-note" id="fu-note"></div>
    <div class="fu-q" id="fu-q"></div>
    <div id="fu-options"></div>
  </div>
</div>

<!-- 結果頁 -->
<div id="screen-result" class="screen">
  <div class="result-header" id="result-header">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-badge" id="result-badge"></div>
    <div class="result-title" id="result-title"></div>
  </div>
  <div class="result-body">
    <div id="result-streak-wrap" style="display:none;text-align:center;margin-bottom:12px"></div>
    <div class="result-msg" id="result-msg"></div>
    <div id="cm-section" style="display:none"></div>
  </div>
  <div class="result-footer">
    <button class="btn-done"  onclick="liff.closeWindow()">✓ 完成</button>
    <button class="btn-again" onclick="showScreen('list')">再回報一個症狀</button>
  </div>
</div>

<script>
// ── 同意書檢查 ────────────────────────────────────────────────
const LIFF_CONSENT_URL = 'https://liff.line.me/2010034796-myAIBrsg';

async function checkConsent(userId, gasUrl)
{
  try {
    const r = await fetch(`${gasUrl}?action=getConsent&userId=${encodeURIComponent(userId)}`);
    const d = await r.json();
    if (d.ok && d.status === 'consented') return true;
  }
  catch(e) { console.warn('checkConsent error:', e); }

  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:32px 24px;
      font-family:-apple-system,'PingFang TC',sans-serif;background:#F4F6F9;">
      <div style="font-size:56px;margin-bottom:20px">📋</div>
      <div style="font-size:18px;font-weight:800;color:#1A3A5C;margin-bottom:12px">請先完成研究同意書</div>
      <div style="font-size:14px;color:#64748B;text-align:center;line-height:1.8;margin-bottom:28px;max-width:280px">
        使用本系統前，需先閱讀並完成研究知情同意書。
      </div>
      <button onclick="liff.openWindow({url:'${LIFF_CONSENT_URL}',external:false})"
        style="padding:14px 32px;background:#1A3A5C;color:#fff;border:none;
          border-radius:12px;font-size:15px;font-weight:700;cursor:pointer">
        📋 前往填寫同意書
      </button>
    </div>`;
  return false;
}

// ── 分級資訊 ──────────────────────────────────────────────────
const LEVELS = {
  1: {
    cls: 'l1', icon: '🚨', badge: '第一級 L1',
    title: '請立即前往急診',
    msg: `<strong>您的症狀需要立即就醫處置。</strong><br><br>
請<strong>立刻</strong>前往急診室，勿等待或自行觀察。<br>
若不方便移動，請立刻通知家屬或撥打 119。`,
  },
  '2a': {
    cls: 'l2a', icon: '⚠️', badge: '第二級A L2A',
    title: '請今天聯絡個管師',
    msg: `<strong>您的症狀需要個管師今天介入評估。</strong><br><br>
請<strong>今天</strong>聯絡您的個案管理師，說明目前症狀。<br>
個管師將協助安排提早回診、抽血或必要處置。<br><br>
若症狀突然加重，請直接前往急診。`,
  },
  '2b': {
    cls: 'l2b', icon: '📋', badge: '第二級B L2B',
    title: '請加強自我照護並持續回報',
    msg: `<strong>您的症狀目前需要加強觀察與自我照護。</strong><br><br>
• 多休息，維持充足水分<br>
• <strong>若症狀加重，請今天聯絡個管師</strong><br>
• 明天請繼續回報症狀，系統會提醒您<br>
• 下次門診時告知醫師目前狀況`,
  },
  3: {
    cls: 'l3', icon: '✅', badge: '第三級 L3',
    title: '可自行觀察',
    msg: `您回報的症狀目前在可觀察範圍內。<br><br>
• 多休息，維持適當水分補充<br>
• 若症狀持續超過 3 天或突然加重，請聯絡個管師<br>
• 下次門診時告知醫師目前狀況`,
  },
  no_symptom: {
    cls: 'l3', icon: '😊', badge: '今日無症狀',
    title: '很棒！繼續維持！',
    msg: `今天沒有不舒服，很棒！<br><br>
• 持續規律回報，幫助醫療團隊掌握您的狀況<br>
• 若之後出現任何不適，隨時可以回來回報<br>
• 保持良好的生活習慣，繼續加油 💪`,
  },
};

// ── 症狀清單 ──────────────────────────────────────────────────
const SYMS = [
  // no_symptom
  { id:'no_symptom', label:'😊 無症狀', cat:'__base__', grading:()=>3 },

  // 感染/急症
  {
    id:'fever', label:'🌡️ 發燒', cat:'感染／急症',
    grading: ()=>1,
  },
  {
    id:'chills', label:'🥶 畏寒/寒顫', cat:'感染／急症',
    grading: ()=>1,
  },
  {
    id:'throat_swallow', label:'😮 喉嚨痛/吞嚥困難', cat:'感染／口腔',
    followup: {
      q:'吞嚥困難的程度是？',
      opts:[
        { label:'完全無法吞嚥，或合併發燒/脫水', v:'l1' },
        { label:'明顯影響進食（吃不下固體）', v:'l2a' },
        { label:'需軟食，吞藥或喝水變慢', v:'l2b' },
        { label:'輕微，可正常進食喝水', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },
  {
    id:'oral_mucositis', label:'🦷 嘴破/口腔黏膜炎', cat:'感染／口腔',
    followup: {
      q:'嘴破的程度是？',
      opts:[
        { label:'無法吃喝、明顯出血，或合併發燒', v:'l1' },
        { label:'持續惡化、有出血或快吃不下', v:'l2a' },
        { label:'疼痛明顯，吃東西變少，需止痛或口腔照護', v:'l2b' },
        { label:'輕微疼痛，不影響吃喝', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },

  // 呼吸
  {
    id:'cough', label:'😷 咳嗽', cat:'呼吸',
    followup: {
      q:'咳嗽的狀況是？',
      opts:[
        { label:'咳血、合併喘/發燒，或移植病人咳嗽持續惡化', v:'l1' },
        { label:'中重度咳嗽，需個管師當日評估', v:'l2a' },
        { label:'有痰、影響睡眠，或持續超過 3 天', v:'l2b' },
        { label:'輕微乾咳，無發燒也不喘', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },
  {
    id:'hemoptysis', label:'🩸 咳血', cat:'呼吸',
    grading: ()=>1,
  },
  {
    id:'dyspnea', label:'😮‍💨 喘/呼吸困難', cat:'呼吸',
    followup: {
      q:'呼吸困難的程度是？',
      opts:[
        { label:'休息時也喘、血氧下降、嘴唇發紫，或移植病人新出現喘', v:'l1' },
        { label:'講話或輕微活動就覺得喘，生命徵象尚穩定', v:'l2a' },
        { label:'平地走一段路會喘', v:'l2b' },
        { label:'只有快走才喘，休息後可恢復', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },

  // 神經
  {
    id:'somnolence', label:'😵 嗜睡/意識改變', cat:'神經',
    followup: {
      q:'意識/嗜睡的狀況是？',
      opts:[
        { label:'叫不太醒、答非所問、昏倒或抽搐', v:'l1' },
        { label:'持續恍神或白天睡太多', v:'l2a' },
        { label:'需要叫醒、反應變慢', v:'l2b' },
        { label:'只是疲倦，仍可清楚對答', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },

  // GI
  {
    id:'nausea', label:'🤢 噁心', cat:'GI 症狀',
    followup: {
      q:'噁心的程度是？',
      opts:[
        { label:'幾乎無法進食喝水，或伴嚴重虛弱', v:'l1' },
        { label:'持續變差、接近脫水', v:'l2a' },
        { label:'吃不到一半、需止吐藥，或 24 小時內反覆', v:'l2b' },
        { label:'輕微，仍可吃喝', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },
  {
    id:'vomiting', label:'🤮 嘔吐', cat:'GI 症狀',
    followup: {
      q:'嘔吐的狀況是？',
      opts:[
        { label:'24 小時 ≥ 6 次、吐血，或完全無法喝水', v:'l1' },
        { label:'持續嘔吐但血壓正常、精神尚可', v:'l2a' },
        { label:'24 小時 2–5 次，需追蹤補水和止吐', v:'l2b' },
        { label:'24 小時 1 次且可喝水', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },
  {
    id:'diarrhea', label:'🚽 腹瀉', cat:'GI 症狀',
    followup: {
      q:'腹瀉的狀況是？',
      opts:[
        { label:'血便/黑便、合併發燒脫水，或持續 ≥ 10 次', v:'l1' },
        { label:'7–10 次但血壓心跳正常、精神尚可', v:'l2a' },
        { label:'24 小時 4–6 次', v:'l2b' },
        { label:'24 小時增加 < 4 次，無血無燒', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },
  {
    id:'constipation', label:'💊 便秘', cat:'GI 症狀',
    followup: {
      q:'便秘的狀況是？',
      opts:[
        { label:'合併腹脹嘔吐、劇痛、完全無排氣', v:'l1' },
        { label:'一週未解便或用藥無效', v:'l2a' },
        { label:'3–5 天未解便', v:'l2b' },
        { label:'1–3 天未解，但仍可排氣', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },
  {
    id:'anorexia', label:'🍽️ 食慾不振', cat:'GI 症狀',
    followup: {
      q:'食慾不振的狀況是？',
      opts:[
        { label:'幾乎無法進食喝水', v:'l1' },
        { label:'持續吃不下或體重快速下降', v:'l2a' },
        { label:'連續 > 3 天吃不到一半', v:'l2b' },
        { label:'食量略差，仍可正常進食', v:'l3' },
      ],
      grading: v => v==='l1'?1:v==='l2a'?'2a':v==='l2b'?'2b':3,
    },
  },

  // 血液/出血
  {
    id:'epistaxis', label:'👃 鼻出血', cat:'血液／出血',
    followup: {
      q:'鼻出血的狀況是？',
      opts:[
        { label:'止不住 > 15 分鐘、大量，或移植病人合併頭暈虛弱', v:'l1' },
        { label:'需評估血小板或輸血', v:'l2a' },

// ── 狀態 ─────────────────────────────────────────────────────
let userId      = '';
let userProfile = null;
let currentSym  = null;
let GAS_URL     = 'https://script.google.com/macros/s/AKfycbx2nSmOjcKrcMpK9XwRHWz-JeUFfHCoNggMnIYHyKx7B_338N8XQk3stmXIQ1Ppj1Z25w/exec';

// ── 初始化 ───────────────────────────────────────────────────
async function init()
{
  await liff.init({ liffId: '2010034796-kIBFrrkM' });
  if (!liff.isLoggedIn()) { liff.login(); return; }
  const profile = await liff.getProfile();
  userId      = profile.userId;
  userProfile = profile;

  if (!await checkConsent(userId, GAS_URL)) return;

  await fetch(`${GAS_URL}?action=savePatient&userId=${userId}&displayName=${encodeURIComponent(profile.displayName)}`);
  renderSymptoms();
  showScreen('list');
}

// ── 渲染症狀清單 ─────────────────────────────────────────────
function renderSymptoms()
{
  const el   = document.getElementById('symptom-list');
  const cats = {};
  SYMS.forEach(s => {
    if (s.cat === '__base__') return;
    if (!cats[s.cat]) cats[s.cat] = [];
    cats[s.cat].push(s);
  });

  el.innerHTML = Object.entries(cats).map(([cat, syms]) => {
    const btns = syms.map(s => {
      const parts = s.label.split(' ');
      const icon  = parts[0];
      const name  = parts.slice(1).join(' ');
      return `<button class="sym-btn" onclick="selectSym('${s.id}')">
        <span class="sym-icon">${icon}</span>
        <span class="sym-name">${name}</span>
      </button>`;
    }).join('');
    return `<div class="cat-label">${cat}</div><div class="sym-grid">${btns}</div>`;
  }).join('');
}

// ── 選症狀 ───────────────────────────────────────────────────
function selectSym(id)
{
  currentSym = SYMS.find(s => s.id === id);
  if (!currentSym) return;

  if (id === 'no_symptom') { doResult(3, null, null); return; }
  if (!currentSym.followup) { doResult(currentSym.grading(null), null, null); return; }

  // 顯示追問
  document.getElementById('fu-header').textContent = currentSym.label;
  document.getElementById('fu-note').textContent   = currentSym.note || '';
  document.getElementById('fu-q').textContent      = currentSym.followup.q;
  document.getElementById('fu-options').innerHTML  = currentSym.followup.opts.map(o =>
    `<button class="opt-btn" onclick="selectOpt('${o.v}','${o.label.replace(/'/g,"\\'")}')">
       ${o.label}
     </button>`
  ).join('');
  showScreen('followup');
}

function selectOpt(v, label)
{
  const level = currentSym.followup.grading(v);
  doResult(level, currentSym.followup.q, label);
}

// ── 顯示結果 ──────────────────────────────────────────────────
async function doResult(level, fKey, fAns)
{
  const info = (currentSym?.id === 'no_symptom') ? LEVELS.no_symptom : LEVELS[level];
  const hdr  = document.getElementById('result-header');
  hdr.className = `result-header ${info.cls}`;
  document.getElementById('result-icon').textContent  = info.icon;
  document.getElementById('result-badge').textContent = info.badge;
  document.getElementById('result-title').textContent = info.title;
  document.getElementById('result-msg').innerHTML     = info.msg;

  // 個管師資訊（L1 / L2A 顯示）
  const cmSec = document.getElementById('cm-section');
  if (level === 1 || level === '2a') {
    try {
      const r = await fetch(`${GAS_URL}?action=getCM&userId=${userId}`);
      const d = await r.json();
      if (d.found) {
        const cm = d.data;
        const ph = cm.phone.replace(/[^0-9+]/g, '');
        cmSec.innerHTML = `
          <div class="cm-card">
            <div class="cm-label">您的個案管理師</div>
            <div class="cm-name">👩‍⚕️ ${cm.name}</div>
            <div class="cm-info">📞 ${cm.phone}${cm.email?'　✉️ '+cm.email:''}</div>
            <div class="cm-btns">
              <a class="cm-btn cm-btn-call"  href="tel:${ph}">📞 電話</a>
              <a class="cm-btn cm-btn-sms"   href="sms:${ph}">💬 簡訊</a>
              ${cm.email?`<a class="cm-btn cm-btn-email" href="mailto:${cm.email}">✉️ Email</a>`:''}
            </div>
          </div>`;
        cmSec.style.display = 'block';
      } else { cmSec.style.display = 'none'; }
    } catch(e) { cmSec.style.display = 'none'; }
  } else {
    cmSec.style.display = 'none';
  }

  showScreen('result');

  // 記錄 + 通知（背景）
  const patient = await fetch(`${GAS_URL}?action=getPatient&userId=${userId}`).then(r=>r.json());
  const pd = patient.data || {};
  // level: 1 / '2a' / '2b' / 3（直接傳，不轉換）
  const levelStr = String(level);

  try {
    const resp = await fetch(
      `${GAS_URL}?action=logSymptom&userId=${userId}` +
      `&displayName=${encodeURIComponent(userProfile?.displayName||'')}` +
      `&realName=${encodeURIComponent(pd.real_name||'')}` +
      `&mrn=${encodeURIComponent(pd.mrn||'')}` +
      `&symptomCat=${encodeURIComponent(currentSym?.cat||'')}` +
      `&symptomId=${currentSym?.id||''}` +
      `&symptomLabel=${encodeURIComponent(currentSym?.label||'')}` +
      `&followupKey=${encodeURIComponent(fKey||'')}` +
      `&followupAnswer=${encodeURIComponent(fAns||'')}` +
      `&level=${levelStr}` +
      `&levelDetail=${levelStr}`
    );
    const logData = await resp.json();
    if (logData.streak !== undefined) showStreakBadge(logData.streak, logData.is_new_day);
  } catch(e) { console.error('logSymptom:', e); }

  // L1 和 L2A 通知個管師；L2B 不需要立即通知（系統明天提醒）
  if (level === 1 || level === '2a') {
    fetch(`${GAS_URL}?action=notifyCM&userId=${userId}` +
      `&patientName=${encodeURIComponent(pd.real_name||userProfile?.displayName||'')}` +
      `&mrn=${encodeURIComponent(pd.mrn||'')}` +
      `&symptomLabel=${encodeURIComponent(currentSym?.label||'')}` +
      `&followupAnswer=${encodeURIComponent(fAns||'')}` +
      `&level=${levelStr}` +
      `&levelDetail=${levelStr}`
    );
  }
}

// ── 連續回報天數 ──────────────────────────────────────────────
function showStreakBadge(streak, isNewDay)
{
  if (!isNewDay) return;
  const wrap = document.getElementById('result-streak-wrap');
  if (!wrap) return;
  const milestones = {
    3:'連續回報 3 天！很棒，繼續保持 👍',
    7:'連續回報 1 週！你真的很認真照顧自己 ⭐',
    14:'連續回報 2 週！個管師說謝謝你這麼配合 🙏',
    30:'連續回報 1 個月！你是最認真的病人 🏆',
    60:'連續回報 2 個月！你是我們的健康之星 🌟',
  };
  let html = `<div class="streak-badge">🔥 已連續回報 ${streak} 天</div>`;
  if (milestones[streak]) html += `<div class="streak-milestone">🎉 ${milestones[streak]}</div>`;
  wrap.innerHTML   = html;
  wrap.style.display = 'block';
}

function showScreen(name)
{
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  window.scrollTo(0, 0);
}

init().catch(console.error);
</script>
